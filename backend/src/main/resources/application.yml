spring:
  application:
    name: digital-document-shop
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          starttls:
            enable: true
          timeout: 5000
          writetimeout: 5000
  datasource:
    url: jdbc:mysql://localhost:3306/digital_document_shop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  # Dev fallback only. Production must set JWT_SECRET in environment variables.
  secret: ${JWT_SECRET:ZGV2X29ubHlfand0X3NlY3JldF9mb3JfZGlnaXRhbF9kb2N1bWVudF9zaG9wX2NoYW5nZV9pbl9wcm9k}
  expirationMs: 86400000 # 24 hours

app:
  upload-dir: uploads
  frontend-url: http://localhost:5173
  # Prefix nội dung chuyển khoản - người dùng phải ghi "DIGIDOC <orderCode>"
  transfer-prefix: DIGIDOC
  email:
    provider: ${EMAIL_PROVIDER:smtp}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}

resend:
  api-key: ${RESEND_API_KEY:}

gmail:
  client-id: ${GMAIL_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
  client-secret: ${GMAIL_CLIENT_SECRET:}
  refresh-token: ${GMAIL_REFRESH_TOKEN:}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

# =============================================
# Cấu hình SePay (điền vào sau khi đăng ký)
# =============================================
sepay:
  # API Key lấy từ sepay.vn → Cài đặt → API Key
  api-key: ${SEPAY_API_KEY:}
  # Webhook token = API Key (SePay dùng cùng 1 key)
  webhook-token: ${SEPAY_WEBHOOK_TOKEN:}

# =============================================
# Thông tin tài khoản ngân hàng của bạn
# =============================================
bank:
  # TPBank (Tien Phong Bank)
  id: "970423"
  account-number: ${BANK_ACCOUNT_NUMBER:}
  account-name: ${BANK_ACCOUNT_NAME:}
  display-name: ${BANK_DISPLAY_NAME:TPBank (Tien Phong Bank)}

# =============================================
# Cloudinary — lưu ảnh thumbnail trên cloud
# Đăng ký tại cloudinary.ccom (miễn phí 25GB)
# =============================================
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

server:
  port: 8080
  error:
    include-message: always 
